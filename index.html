<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Mart - Login</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Container Setup -->
    <div class="container">

        <!-- Left Section: Image -->
        <div class="left-section">
            <img src="laundry.png" alt="Washing machine with a laundry basket">
        </div>

        <!-- Right Section: Form -->
        <div class="right-section">
            <form class="login-form">

                <!-- Form Heading and Description -->
                <h1 class="form-heading">Hi Again!</h1>
                <p class="form-subtext">Welcome back, we missed you!</p>

                <!-- Email and Password Inputs -->
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                </div>

                <a href="#" class="forgot-link">Forgot Password?</a>

                <!-- Login Button -->
                <button type="submit" class="login-btn">Login</button>

                <p class="signup-text">Don't have an account? <a href="#">Sign up</a></p>
            </form>
        </div>

    </div>

</body>
</html>
